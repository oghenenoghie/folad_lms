name: Deploy API to cPanel

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, bcmath
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure test database
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD="
          } >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Debug PING_TEST (non-sensitive, safe to print directly)
        env:
          PT: ${{ secrets.PING_TEST }}
        run: |
          if [ -z "$PT" ]; then
            echo "PING_TEST: EMPTY"
          else
            echo "PING_TEST: $PT"
          fi

      - name: Debug secret presence (prints only emptiness/length, never values)
        env:
          S_HOST: ${{ secrets.CPANEL_HOST }}
          S_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          S_USER: ${{ secrets.CPANEL_USER }}
          S_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          S_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          for name in S_HOST S_PORT S_USER S_KEY S_PATH; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "$name: EMPTY"
            else
              echo "$name: present, length=${#val}"
            fi
          done

      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, bcmath
          coverage: none

      # cPanel shared hosting has no Composer, so vendor/ is built here in CI
      # and shipped to the server by rsync below, rather than running
      # `composer install` over SSH.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Enter maintenance mode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          # Fails harmlessly on the very first deploy, before vendor/ exists
          # on the server and artisan can run at all.
          script: cd ${{ secrets.CPANEL_DEPLOY_PATH }} && php artisan down || true

      - name: Sync app to cPanel
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=.git --exclude=.github
            --exclude=.env --exclude=.env.*
            --exclude=node_modules --exclude=tests
            --exclude=storage/app/**
            --exclude=storage/logs/**
            --exclude=storage/framework/cache/**
            --exclude=storage/framework/sessions/**
            --exclude=storage/framework/views/**
            --exclude=storage/framework/testing/**
            --exclude=bootstrap/cache/*.php
            --exclude=database/database.sqlite
          path: ./
          remote_path: ${{ secrets.CPANEL_DEPLOY_PATH }}
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_port: ${{ secrets.CPANEL_SSH_PORT }}
          remote_user: ${{ secrets.CPANEL_USER }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Migrate, cache, and bring app back up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.CPANEL_DEPLOY_PATH }}
            mkdir -p storage/backups
            export $(grep -E '^DB_(DATABASE|USERNAME|PASSWORD)=' .env | xargs)
            mysqldump -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" > "storage/backups/pre-deploy-$(date +%Y%m%d%H%M%S).sql" || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            php artisan up
